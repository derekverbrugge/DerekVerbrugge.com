name: Maintain discovery files
on:
  push:
    paths:
      - '**.html'
      - 'scripts/generate_discovery.py'
      - '.github/workflows/discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_discovery.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt llms.txt llms-full.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh discovery assets"
            git push
          fi
